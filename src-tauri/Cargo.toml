[package]
name = "beskonechnaya-noch"
version = "10.22.0"
description = "бесконечная ночь — роглайк о шарике света, коему не спится"
authors = ["killu"]
license = ""
repository = "https://github.com/demilapkill-cloud/io-noch"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "noch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Выпуск затачивается на скорость и малый вес: игре нужен лёгкий кадр,
# а игроку — небольшая свёртка.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
