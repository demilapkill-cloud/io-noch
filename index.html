  :root{
    --night-0:#07090c; --ink:#ebe8e1;
    --ink-2:rgba(235,232,225,.62); --ink-3:rgba(235,232,225,.38); --ink-4:rgba(235,232,225,.18);
    --line:rgba(235,232,225,.12);
    --ember:#e8a54a; --frost:#9fb4c7; --hyper:#ff4fd8; --io:#8fd0ff;
    --danger:#d8695a;
    /* один шрифт на всю игру */
    --font-display:'SAO UI','Trebuchet MS',system-ui,sans-serif;
    --font-mono:'SAO UI','Trebuchet MS',system-ui,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--night-0);color:var(--ink);overflow:hidden;
    overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font-mono);-webkit-font-smoothing:antialiased;touch-action:none;
    user-select:none;-webkit-user-select:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .playing{cursor:none}

  .mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease);z-index:5}
  #hud.on{opacity:1}
  #hud .tl{position:fixed;top:calc(18px + env(safe-area-inset-top));left:calc(22px + env(safe-area-inset-left))}
  #hud .tr{position:fixed;top:calc(18px + env(safe-area-inset-top));right:calc(22px + env(safe-area-inset-right));text-align:right}
  #hud .clock{font-size:13px;color:var(--ink-2);letter-spacing:.22em;font-family:var(--font-mono)}
  #hud .nightname{margin-top:6px;font-size:10px;color:var(--ink-3);letter-spacing:.2em;text-transform:uppercase;font-family:var(--font-mono)}
  #hud .nightname.storm{color:var(--hyper);animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #hud .score{font-size:13px;color:var(--ink-2);letter-spacing:.22em;font-family:var(--font-mono)}
  #hud .combo{margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);transition:color .3s,opacity .3s;opacity:0;font-family:var(--font-mono)}
  #hud .combo.hot{opacity:1;color:var(--ember)}
  /* бодрость + опыт */
  #meter{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(235,232,225,.05);
    background-image:repeating-linear-gradient(90deg, transparent 0, transparent calc(25% - 1px), rgba(235,232,225,.14) calc(25% - 1px), rgba(235,232,225,.14) 25%)}
  #meterFill{height:100%;width:100%;background:linear-gradient(90deg, var(--io), #c9e8ff);box-shadow:0 0 14px var(--io);transition:background .8s}
  #xpbar{position:fixed;left:0;right:0;bottom:6px;height:2px;background:rgba(235,232,225,.04)}
  #xpFill{height:100%;width:0%;background:var(--ember);box-shadow:0 0 10px var(--ember);opacity:.9;transition:width .25s var(--ease)}
  #meterLabel{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:calc(66px + env(safe-area-inset-left));font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-4);font-family:var(--font-mono)}
  /* полоса способностей: что нажать и готово ли оно */
  #skills{position:fixed;right:calc(20px + env(safe-area-inset-right));
    bottom:calc(44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
    align-items:flex-end;gap:9px;opacity:.6;transition:opacity .3s var(--ease)}
  .sk{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);transition:color .25s,opacity .25s}
  .sk i{font-style:normal;font-size:9px;letter-spacing:.06em;color:var(--ink-4);
    border:1px solid var(--line);padding:2px 6px;min-width:22px;text-align:center;transition:all .25s}
  .sk.ready{color:var(--ink-2)}
  .sk.ready i{color:var(--io);border-color:rgba(143,208,255,.45)}
  .sk.on{color:var(--io)}
  .sk.on i{color:var(--night-0);background:var(--io);border-color:var(--io);box-shadow:0 0 16px rgba(143,208,255,.45)}
  .sk.cool{opacity:.4}
  .touch #skills{display:none}
  #hud .lvl{margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);font-family:var(--font-mono)}
  #hud .tl,#hud .tr{padding-top:2px}
  #hud .tl{border-left:1px solid var(--line);padding-left:12px}
  #hud .tr{border-right:1px solid var(--line);padding-right:12px}

  /* полоса корабля-кошмара */
  #bossHud{position:fixed;top:calc(72px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    width:min(430px,64vw);text-align:center;opacity:0;transition:opacity .8s var(--ease)}
  #bossHud.on{opacity:1}
  .boss-name{font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--hyper);margin-bottom:8px;text-shadow:0 0 14px rgba(255,79,216,.5)}
  .boss-bar{height:3px;background:rgba(235,232,225,.07)}
  #bossFill{height:100%;width:100%;background:linear-gradient(90deg,#6d2496,var(--hyper));
    box-shadow:0 0 14px rgba(255,79,216,.55);transition:width .25s var(--ease)}

  /* кнопки под большой палец (тач) */
  #touchPad{position:fixed;right:calc(16px + env(safe-area-inset-right));
    bottom:calc(20px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:11px;
    pointer-events:none;z-index:6}
  .touch #touchPad{display:flex}
  body.touch-left #touchPad{right:auto;left:calc(18px + env(safe-area-inset-left))}
  body.touch-left #setBtn{left:auto;right:calc(16px + env(safe-area-inset-right))}
  .tbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:rgba(12,16,21,.55);color:var(--io);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    padding:11px;transition:background .15s,box-shadow .15s,opacity .25s;touch-action:none}
  .tbtn svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .tbtn.ready{border-color:rgba(143,208,255,.55);box-shadow:0 0 16px rgba(143,208,255,.25)}
  .tbtn.held,.tbtn.on{background:rgba(143,208,255,.25);box-shadow:0 0 24px rgba(143,208,255,.4)}
  .tbtn.cool{opacity:.32;color:var(--ink-3)}
  #btnTether{width:42px;height:42px;padding:10px;align-self:flex-end}
  body.touch-left #btnTether{align-self:flex-start}

  /* ---------- overlays ---------- */
  .veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:10;transition:opacity 1.2s var(--ease);padding:24px}
  .veil.hidden{opacity:0;pointer-events:none}
  #titleScreen{background:radial-gradient(120% 90% at 50% 110%, rgba(143,208,255,.06), transparent 60%)}
  .title-big{font-family:var(--font-display);font-weight:300;
    font-size:clamp(44px,11vw,132px);line-height:.95;letter-spacing:-.02em;color:var(--ink);
    text-shadow:0 0 60px rgba(143,208,255,.3)}
  .title-sub{margin-top:26px;font-size:11px;letter-spacing:.3em;color:var(--ink-3);text-transform:uppercase;font-family:var(--font-mono)}
  .title-help{margin-top:34px;font-size:11px;line-height:2.2;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;font-family:var(--font-mono)}
  .title-hint{margin-top:40px;font-size:11px;letter-spacing:.25em;color:var(--ink-2);text-transform:uppercase;font-family:var(--font-mono);animation:pulse 2.6s var(--ease) infinite}
  @keyframes pulse{50%{opacity:.3}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #titleScreen .title-big{animation:fadeUp 1.1s var(--ease) both}
  #titleScreen .title-sub{animation:fadeUp 1.1s var(--ease) .25s both}
  #titleScreen .title-help{animation:fadeUp 1.1s var(--ease) .45s both}
  #titleScreen .title-best{animation:fadeUp 1.1s var(--ease) .6s both}
  #titleScreen .title-hint{animation:fadeUp 1.1s var(--ease) .7s both, pulse 2.6s var(--ease) 1.8s infinite}
  #deathScreen .end-stat{animation:fadeUp .9s var(--ease) both}
  #deathScreen .end-stat:nth-child(2){animation-delay:.12s}
  #deathScreen .end-stat:nth-child(3){animation-delay:.24s}
  #deathScreen .end-stat:nth-child(4){animation-delay:.36s}
  #deathScreen .death-quote{animation:fadeUp 1s var(--ease) .5s both}
  #restScreen .dream{animation:fadeUp .7s var(--ease) backwards}
  #restScreen .dream:nth-child(2){animation-delay:.12s}
  #restScreen .dream:nth-child(3){animation-delay:.24s}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important}}
  .title-ver{position:fixed;bottom:18px;left:0;right:0;font-size:10px;letter-spacing:.2em;color:var(--ink-4);text-transform:uppercase;font-family:var(--font-mono)}
  .title-best{margin-top:14px;font-size:10px;letter-spacing:.2em;color:var(--ember);text-transform:uppercase;font-family:var(--font-mono)}

  /* выбор сна между ночами */
  #restScreen{background:rgba(7,9,12,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .rest-head{font-size:11px;letter-spacing:.3em;color:var(--ink-3);text-transform:uppercase;font-family:var(--font-mono)}
  .rest-big{font-family:var(--font-display);font-weight:300;font-size:clamp(34px,6vw,64px);margin-top:14px;color:var(--ink)}
  .rest-sub{margin-top:10px;font-size:10px;letter-spacing:.22em;color:var(--ink-4);text-transform:uppercase;font-family:var(--font-mono)}
  .dreams{margin-top:36px;display:flex;gap:30px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:980px}
  .dream{pointer-events:auto;cursor:pointer;width:236px;background:none;border:none;color:inherit;padding:14px 8px;
    display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
    transition:transform .3s var(--ease);outline:none}
  .dream:nth-child(2){margin-top:-28px} /* средний сон приподнят — дуга созвездия */
  .dream:hover,.dream:focus-visible{transform:translateY(-8px)}
  .d-orb{position:relative;width:122px;height:122px;display:grid;place-items:center;
    animation:orbFloat 5.5s ease-in-out infinite;transition:transform .3s var(--ease)}
  .dream:nth-child(1) .d-orb{animation-delay:0s}
  .dream:nth-child(2) .d-orb{animation-delay:-1.8s}
  .dream:nth-child(3) .d-orb{animation-delay:-3.6s}
  @keyframes orbFloat{50%{transform:translateY(-7px)}}
  .dream:hover .d-orb,.dream:focus-visible .d-orb{transform:scale(1.07)}
  .d-orb::before{content:'';position:absolute;inset:16px;border-radius:50%;
    background:radial-gradient(circle, rgba(143,208,255,.17), rgba(143,208,255,.04) 55%, transparent 72%);
    transition:inset .3s var(--ease),background .3s}
  .dream:hover .d-orb::before,.dream:focus-visible .d-orb::before{inset:8px;
    background:radial-gradient(circle, rgba(143,208,255,.26), rgba(143,208,255,.06) 55%, transparent 74%)}
  .d-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .d-ring circle{fill:none;stroke-linecap:round;transform-origin:50% 50%}
  .d-ring .r1{stroke:rgba(143,208,255,.42);stroke-width:1;stroke-dasharray:11 15;animation:ringSpin 26s linear infinite}
  .d-ring .r2{stroke:rgba(143,208,255,.16);stroke-width:1;stroke-dasharray:2 11;animation:ringSpin 40s linear infinite reverse}
  @keyframes ringSpin{to{transform:rotate(360deg)}}
  .dream:hover .d-ring .r1,.dream:focus-visible .d-ring .r1{stroke:rgba(143,208,255,.85);animation-duration:9s}
  .d-ic{position:relative;width:46px;height:46px;color:var(--io);filter:drop-shadow(0 0 10px rgba(143,208,255,.55))}
  .d-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .dream::after{content:attr(data-key);position:absolute;top:2px;right:34px;font-family:var(--font-mono);
    font-size:9px;letter-spacing:.1em;color:var(--ink-4);border:1px solid var(--line);border-radius:50%;
    width:20px;height:20px;display:grid;place-items:center;transition:all .25s}
  .dream:hover::after,.dream:focus-visible::after{color:var(--io);border-color:var(--io);box-shadow:0 0 10px rgba(143,208,255,.35)}
  .d-name{margin-top:18px;font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--io)}
  .d-desc{margin-top:10px;font-family:var(--font-display);font-weight:300;font-size:17.5px;line-height:1.4;color:var(--ink-2);max-width:224px}
  /* редкий сон горит углями и полярной каймой */
  .dream.rare .d-ic{color:var(--ember);filter:drop-shadow(0 0 12px rgba(232,165,74,.65))}
  .dream.rare .d-name{color:var(--ember)}
  .dream.rare .d-ring .r1{stroke:rgba(232,165,74,.55)}
  .dream.rare .d-ring .r2{stroke:rgba(255,79,216,.22)}
  .dream.rare .d-orb::before{background:radial-gradient(circle, rgba(232,165,74,.2), rgba(255,79,216,.06) 55%, transparent 72%)}
  .dream.rare:hover .d-ring .r1,.dream.rare:focus-visible .d-ring .r1{stroke:rgba(232,165,74,.9)}
  .dream.rare:hover .d-orb::before,.dream.rare:focus-visible .d-orb::before{inset:8px;
    background:radial-gradient(circle, rgba(232,165,74,.3), rgba(255,79,216,.08) 55%, transparent 74%)}

  /* смерть */
  #deathScreen{background:rgba(7,9,12,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .death-big{font-family:var(--font-display);font-weight:300;
    font-size:clamp(38px,8vw,84px);line-height:1.05;color:var(--ink)}
  .death-sub{margin-top:16px;font-size:11px;letter-spacing:.28em;color:var(--ink-3);text-transform:uppercase;font-family:var(--font-mono)}
  .end-stats{margin-top:42px;display:flex;gap:48px;justify-content:center;flex-wrap:wrap}
  .end-stat b{display:block;font-family:var(--font-display);font-weight:300;font-size:44px;color:var(--ink);line-height:1}
  .end-stat span{display:block;margin-top:10px;font-size:10px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;font-family:var(--font-mono)}
  .death-quote{margin-top:44px;font-family:var(--font-display);font-weight:300;font-size:22px;color:var(--ink-2);max-width:520px}
  .end-btn{margin-top:50px;pointer-events:auto;cursor:pointer;background:none;color:var(--ink-2);
    border:1px solid var(--line);padding:14px 34px;font-family:var(--font-mono);font-size:11px;
    letter-spacing:.25em;text-transform:uppercase;transition:all .25s var(--ease)}
  .end-btn:hover{color:var(--night-0);background:var(--io);border-color:var(--io);box-shadow:0 0 30px rgba(143,208,255,.4)}

  /* созвездие пойманных фраз */
  .sky-link{margin-top:18px;pointer-events:auto;cursor:pointer;background:none;border:none;
    color:var(--ink-3);font-family:var(--font-mono);font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;border-bottom:1px solid var(--line);padding:6px 2px;transition:all .25s var(--ease)}
  .sky-link:hover{color:var(--io);border-color:var(--io)}
  #skyScreen{background:rgba(5,6,10,.965);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);justify-content:flex-start;padding-top:6vh;overflow-y:auto}
  .sky-count{margin-top:12px;font-family:var(--font-display);font-weight:300;
    font-size:clamp(26px,4.5vw,46px);color:var(--ink)}
  #skyCanvas{width:min(920px,94vw);height:auto;margin-top:10px;pointer-events:auto;touch-action:none}
  .sky-caption{margin-top:6px;min-height:30px;font-family:var(--font-display);
    font-weight:300;font-size:20px;color:var(--ink-2);padding:0 16px}
  .sky-sparks{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:900px}
  .spark{padding:9px 13px;border:1px solid var(--line);text-align:left;min-width:150px}
  .spark b{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-4)}
  .spark span{display:block;margin-top:6px;font-family:var(--font-display);
    font-size:14px;color:var(--ink-4)}
  .spark.lit{border-color:rgba(232,165,74,.45);box-shadow:0 0 18px rgba(232,165,74,.12)}
  .spark.lit b{color:var(--ember)}
  .spark.lit span{color:var(--ink-2)}
  #skyScreen .end-btn{margin-top:30px;margin-bottom:6vh}
  .sky-gain{margin-top:26px;font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ember)}
  .sky-gain.hidden{display:none}

  /* ---------- настройки ---------- */
  #setBtn{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;width:38px;height:38px;padding:8px;
    background:rgba(10,14,20,.5);border:1px solid var(--line);color:var(--ink-3);
    cursor:pointer;pointer-events:auto;opacity:.55;transition:all .25s var(--ease)}
  #setBtn svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
  #setBtn:hover,#setBtn:focus-visible{opacity:1;color:var(--io);border-color:var(--io);
    box-shadow:0 0 18px rgba(143,208,255,.25)}
  .playing #setBtn{opacity:.22}
  .playing #setBtn:hover{opacity:1}
  #setPanel{position:fixed;left:0;top:0;bottom:0;z-index:31;width:min(372px,88vw);
    padding-left:calc(24px + env(safe-area-inset-left));
    background:rgba(6,8,12,.965);border-right:1px solid var(--line);
    padding:26px 24px 34px;overflow-y:auto;display:flex;flex-direction:column;
    transition:transform .35s var(--ease),opacity .35s var(--ease)}
  #setPanel.hidden{transform:translateX(-102%);opacity:0;pointer-events:none}
  .set-head{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--io)}
  .set-note{margin-top:10px;font-size:10px;line-height:1.7;color:var(--ink-4)}
  .set-group{margin-top:24px;padding-bottom:7px;border-bottom:1px solid var(--line);
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
  .set-label{margin-top:16px;font-size:11px;letter-spacing:.08em;color:var(--ink-2)}
  .set-row{margin-top:14px;display:flex;align-items:center;gap:12px;font-size:11px;
    letter-spacing:.06em;color:var(--ink-2);cursor:pointer}
  .set-row span{flex:0 0 42%}
  .set-row b{flex:0 0 32px;text-align:right;font-weight:400;color:var(--ink-4);font-size:10px}
  .set-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:2px;
    background:rgba(235,232,225,.16);outline:none;cursor:pointer}
  .set-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    background:var(--io);box-shadow:0 0 10px rgba(143,208,255,.6);cursor:pointer;
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .set-row input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;background:var(--io);
    box-shadow:0 0 10px rgba(143,208,255,.6);cursor:pointer}
  .seg{margin-top:10px;display:flex;gap:6px}
  .seg button{flex:1;padding:9px 4px;background:none;border:1px solid var(--line);color:var(--ink-4);
    font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;transition:all .2s var(--ease)}
  .seg button:hover{color:var(--ink-2);border-color:var(--ink-4)}
  .seg button.on{color:var(--io);border-color:var(--io);box-shadow:inset 0 0 14px rgba(143,208,255,.18)}
  .set-danger{margin-top:16px;padding:11px;background:none;border:1px solid rgba(216,105,90,.4);
    color:var(--danger);font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;cursor:pointer;transition:all .2s var(--ease)}
  .set-danger:hover{background:rgba(216,105,90,.14)}
  .touch-only{display:none}
  .touch .touch-only{display:block}
  .touch label.set-row.touch-only,.touch .seg.touch-only{display:flex}
  #setPanel .end-btn{margin-top:26px}
  #fpsHud{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);
    display:none;text-shadow:0 0 8px rgba(0,0,0,.8)}
  #fpsHud.on{display:block}
  /* режимы интерфейса */
  body.hud-lite #hud .tl,body.hud-lite #hud .tr,body.hud-lite #meterLabel,body.hud-lite #skills{display:none}
  body.hud-off #hud .tl,body.hud-off #hud .tr,body.hud-off #meterLabel,body.hud-off #skills,
  body.hud-off #meter,body.hud-off #xpbar,body.hud-off #bossHud{display:none}

  #pauseScreen{background:rgba(7,9,12,.55)}
  .pause-txt{font-family:var(--font-display);font-weight:300;font-size:44px;color:var(--ink-2)}
  .pause-sub{margin-top:18px;font-size:10px;letter-spacing:.25em;color:var(--ink-4);text-transform:uppercase;font-family:var(--font-mono)}

  @media (max-width:640px){
    #hud .tl{left:14px} #hud .tr{right:14px}
    .end-stats{gap:26px}
    .dreams{gap:6px;margin-top:20px}
    .dream{width:31%;min-width:150px;padding:8px 4px}
    .dream:nth-child(2){margin-top:-16px}
    .d-orb{width:92px;height:92px}
    .d-ic{width:36px;height:36px}
    .d-desc{font-size:14.5px}
    .dream::after{right:14px}
    .title-help{font-size:9.5px;line-height:2;letter-spacing:.1em;margin-top:22px;padding:0 10px}
    .sky-sparks{gap:8px}
    .spark{min-width:132px;padding:7px 9px}
    .spark span{font-size:13px}
    .sky-caption{font-size:16px}
    #bossHud{top:calc(58px + env(safe-area-inset-top));width:70vw}
    #setBtn{left:12px;bottom:96px}
    #setPanel{padding:20px 18px 28px}
    .set-row span{flex:0 0 38%}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div class="tl">
    <div class="clock" id="clock">23:00</div>
    <div class="nightname" id="nightname">ночь 1</div>
  </div>
  <div class="tr">
    <div class="score" id="score">мыслей · 0</div>
    <div class="combo" id="combo">серия ×2</div>
    <div class="lvl" id="lvl">уровень 1</div>
  </div>
  <div id="bossHud">
    <div class="boss-name" data-i18n="bossName"></div>
    <div class="boss-bar"><div id="bossFill"></div></div>
  </div>
  <div id="fpsHud"></div>
  <div id="meterLabel" data-i18n="wakeLabel"></div>
  <div id="skills">
    <div class="sk" id="skTether"><b data-i18n="btnTether"></b><i data-i18n="keyMouse"></i></div>
    <div class="sk" id="skBlink"><b data-i18n="btnBlink"></b><i id="skBlinkKey"></i></div>
    <div class="sk" id="skCharge"><b data-i18n="ocBtn"></b><i data-i18n="keyShift"></i></div>
  </div>
  <div id="xpbar"><div id="xpFill"></div></div>
  <div id="meter"><div id="meterFill"></div></div>
  <div id="touchPad">
    <button class="tbtn" id="btnTether"><svg viewBox="0 0 24 24"><path d="M4 20c7-1.5 11-5.5 11-11a3 3 0 1 1 6 0"/><circle cx="4" cy="20" r="1.4"/></svg></button>
    <button class="tbtn" id="btnBlink"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 4.5a7.5 7.5 0 0 1 7.5 7.5M12 19.5A7.5 7.5 0 0 1 4.5 12"/></svg></button>
    <button class="tbtn" id="ocBtn"><svg viewBox="0 0 24 24"><path d="M13 3L7 13h4l-1 8 7-11h-4z"/></svg></button>
  </div>
</div>

<div id="titleScreen" class="veil">
  <div class="title-big" data-i18n="titleBig"></div>
  <div class="title-sub" data-i18n="titleSub"></div>
  <div class="title-help" data-i18n-lines="help1,help2,help3,help4" data-i18n-lines-touch="help1t,help2t,help3,help4"></div>
  <div class="title-best hidden" id="bestLine"></div>
  <button class="sky-link" id="skyBtn" data-i18n="skyBtnEmpty"></button>
  <div class="title-hint" data-i18n="titleHint"></div>
  <div class="title-ver" data-i18n="titleVer"></div>
</div>

<div id="restScreen" class="veil hidden">
  <div class="rest-head" id="restHead">степень 2</div>
  <div class="rest-big" data-i18n="restBig"></div>
  <div class="rest-sub" data-i18n="restSub"></div>
  <div class="dreams" id="dreams"></div>
</div>

<div id="deathScreen" class="veil hidden">
  <div class="death-big" data-i18n="deathBig"></div>
  <div class="death-sub" id="deathNight">бессонница твоя длилась 3 ночи</div>
  <div class="end-stats">
    <div class="end-stat"><b id="stNights">0</b><span data-i18n="stNights"></span></div>
    <div class="end-stat"><b id="stMoths">0</b><span data-i18n="stThoughts"></span></div>
    <div class="end-stat"><b id="stKills">0</b><span data-i18n="stKills"></span></div>
    <div class="end-stat"><b id="stDist">0</b><span data-i18n="stDist"></span></div>
  </div>
  <div class="sky-gain hidden" id="skyGain"></div>
  <div class="death-quote" id="deathQuote">и свету случается моргнуть.</div>
  <button class="end-btn" id="againBtn" data-i18n="againBtn"></button>
</div>

<div id="skyScreen" class="veil hidden">
  <div class="rest-head" data-i18n="skyHead"></div>
  <div class="sky-count" id="skyCount">0 из 0</div>
  <canvas id="skyCanvas" width="920" height="460"></canvas>
  <div class="sky-caption" id="skyCaption" data-i18n="skyHint"></div>
  <div class="sky-sparks" id="skySparks"></div>
  <button class="end-btn" id="skyBack" data-i18n="skyBack"></button>
</div>

<div id="pauseScreen" class="veil hidden">
  <div class="pause-txt" data-i18n="pauseTxt"></div>
  <div class="pause-sub" data-i18n="pauseSub"></div>
</div>


<button id="setBtn" aria-label="settings">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.3 13.2a7.7 7.7 0 0 0 0-2.4l2-1.4-2-3.4-2.3 1a7.7 7.7 0 0 0-2.1-1.2L14.5 3h-4l-.4 2.8a7.7 7.7 0 0 0-2.1 1.2l-2.3-1-2 3.4 2 1.4a7.7 7.7 0 0 0 0 2.4l-2 1.4 2 3.4 2.3-1a7.7 7.7 0 0 0 2.1 1.2l.4 2.8h4l.4-2.8a7.7 7.7 0 0 0 2.1-1.2l2.3 1 2-3.4z"/>
  </svg>
</button>

<div id="setPanel" class="hidden">
  <div class="set-head" data-i18n="settings"></div>
  <div class="set-note" data-i18n="sHintPause"></div>

  <div class="set-group" data-i18n="sLang"></div>
  <div class="seg" id="segLang"><button data-v="ru">русский</button><button data-v="en">english</button></div>

  <div class="set-group" data-i18n="sSound"></div>
  <label class="set-row"><span data-i18n="sVol"></span><input type="range" id="rngVol" min="0" max="100" step="5"><b id="valVol"></b></label>
  <label class="set-row"><span data-i18n="sMusic"></span><input type="range" id="rngMusic" min="0" max="100" step="5"><b id="valMusic"></b></label>
  <label class="set-row"><span data-i18n="sSfx"></span><input type="range" id="rngSfx" min="0" max="100" step="5"><b id="valSfx"></b></label>

  <div class="set-group" data-i18n="sPicture"></div>
  <div class="set-label" data-i18n="sQuality"></div>
  <div class="seg" id="segQual">
    <button data-v="auto" data-i18n="qAuto"></button>
    <button data-v="high" data-i18n="qHigh"></button>
    <button data-v="low" data-i18n="qLow"></button>
  </div>
  <label class="set-row"><span data-i18n="sShake"></span><input type="range" id="rngShake" min="0" max="100" step="5"><b id="valShake"></b></label>
  <label class="set-row"><span data-i18n="sFx"></span><input type="range" id="rngFx" min="0" max="100" step="5"><b id="valFx"></b></label>
  <div class="set-label" data-i18n="sHud"></div>
  <div class="seg" id="segHud">
    <button data-v="full" data-i18n="hFull"></button>
    <button data-v="lite" data-i18n="hLite"></button>
    <button data-v="off" data-i18n="hOff"></button>
  </div>

  <div class="set-label" data-i18n="sFps"></div>
  <div class="seg" id="segFps">
    <button data-v="off" data-i18n="sOff"></button>
    <button data-v="on" data-i18n="sOn"></button>
  </div>

  <div class="set-group touch-only" data-i18n="sTouch"></div>
  <div class="set-label touch-only" data-i18n="sTouchSide"></div>
  <div class="seg touch-only" id="segSide">
    <button data-v="right" data-i18n="sideRight"></button>
    <button data-v="left" data-i18n="sideLeft"></button>
  </div>
  <label class="set-row touch-only"><span data-i18n="sJoyR"></span><input type="range" id="rngJoy" min="40" max="140" step="5"><b id="valJoy"></b></label>
  <div class="set-label touch-only" data-i18n="sJoyShow"></div>
  <div class="seg touch-only" id="segJoyShow">
    <button data-v="off" data-i18n="sOff"></button>
    <button data-v="on" data-i18n="sOn"></button>
  </div>

  <div class="set-group" data-i18n="sMemory"></div>
  <button class="set-danger" id="setReset" data-i18n="sReset"></button>
  <div class="set-note" id="setResetHint" data-i18n="sResetHint"></div>

  <button class="end-btn" id="setClose" data-i18n="sClose"></button>
</div>

<script src="game.js?v=92"></script>
</body>
</html>
